version: "2"

sql:
  - name: wallet
    engine: postgresql
    schema: migrations/wallet
    queries: services/wallet/internal/storage/queries
    gen:
      go:
        package: storage
        out: services/wallet/internal/storage/generated
        sql_package: pgx/v5
        emit_interface: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        query_parameter_limit: 0
        overrides:
          - db_type: "uuid"
            go_type:
              import: "digitalwallet/shared/identifiers"
              package: "identifiers"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "digitalwallet/shared/identifiers"
              package: "identifiers"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
