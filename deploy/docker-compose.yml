name: digital-wallet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--name", "digital-wallet-nats"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30

  wallet-source:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/wallet.Dockerfile
    environment:
      SERVICE_NAME: wallet
      INSTANCE_NAME: wallet-source
      HTTP_ADDR: :8080
      INTERNAL_HTTP_ADDR: :8085
      INTERNAL_TOKEN: internal-secret-token
      DATABASE_URL: postgres://wallet_source_role:wallet_source_dev_password@postgres:5432/wallet_source?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    ports:
      - "8081:8080"
      - "127.0.0.1:8181:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  wallet-destination:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/wallet.Dockerfile
    environment:
      SERVICE_NAME: wallet
      INSTANCE_NAME: wallet-destination
      HTTP_ADDR: :8080
      INTERNAL_HTTP_ADDR: :8085
      INTERNAL_TOKEN: internal-secret-token
      DATABASE_URL: postgres://wallet_destination_role:wallet_destination_dev_password@postgres:5432/wallet_destination?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    ports:
      - "8082:8080"
      - "127.0.0.1:8182:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  transfer:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/transfer.Dockerfile
    environment:
      SERVICE_NAME: transfer
      INSTANCE_NAME: transfer
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://transfer_role:transfer_dev_password@postgres:5432/transfer?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  projector:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/projector.Dockerfile
    environment:
      SERVICE_NAME: projector
      INSTANCE_NAME: projector
      HTTP_ADDR: :8080
      INTERNAL_HTTP_ADDR: :8085
      INTERNAL_TOKEN: internal-secret-token
      DATABASE_URL: postgres://projector_role:projector_dev_password@postgres:5432/read?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    ports:
      - "8084:8080"
      - "127.0.0.1:8184:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
