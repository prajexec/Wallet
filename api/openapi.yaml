openapi: 3.1.0
info:
  title: Digital Wallet API
  version: 0.1.0
  license:
    name: Internal project contract
    identifier: NOASSERTION
  description: |
    Phase 3 immutable-ledger contract for the fintech-grade digital wallet backend.
    Monetary values are integer minor units and v1 supports USD only.
servers:
  - url: https://api.digital-wallet.invalid
    description: Deployment-specific API endpoint
security: []
tags:
  - name: Wallets
    description: Public wallet commands and authoritative reads.
  - name: Transfers
    description: Public wallet-to-wallet transfer commands and inspection.
  - name: Internal wallet
    description: Service-to-service wallet operations; protected by X-Internal-Token on the internal listener.
  - name: Internal management
    description: Service telemetry and operational metrics served on the internal listener.
  - name: Health
    description: Liveness and dependency-aware readiness probes.
paths:
  /v1/wallets:
    post:
      tags: [Wallets]
      summary: Create a wallet
      operationId: createWallet
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet created
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/wallets/{wallet_id}:
    get:
      tags: [Wallets]
      summary: Read wallet metadata
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Wallet metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/wallets/{wallet_id}/balance:
    get:
      tags: [Wallets]
      summary: Read an authoritative journal-derived balance
      operationId: getWalletBalance
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/wallets/{wallet_id}/entries:
    get:
      tags: [Wallets]
      summary: Read authoritative journal entries
      operationId: listWalletEntries
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Immutable entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/wallets/{wallet_id}/deposit:
    post:
      tags: [Wallets]
      summary: Post a deposit
      operationId: postDeposit
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyCommand'
      responses:
        '201':
          description: Deposit journal entry
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalCommandResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/wallets/{wallet_id}/withdraw:
    post:
      tags: [Wallets]
      summary: Post a withdrawal
      operationId: postWithdrawal
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyCommand'
      responses:
        '201':
          description: Withdrawal journal entry
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalCommandResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: Invalid request or insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/transfers:
    post:
      tags: [Transfers]
      summary: Create a wallet-to-wallet transfer
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '202':
          description: Transfer accepted by the saga
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/transfers/{transfer_id}:
    get:
      tags: [Transfers]
      summary: Inspect a transfer
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/RequireConsistentThrough'
      responses:
        '200':
          description: Transfer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/wallets/{wallet_id}/reservations:
    post:
      tags: [Internal wallet]
      summary: Reserve source funds
      operationId: reserveWalletFunds
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMoneyCommand'
      responses:
        '200':
          description: Existing or newly created reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/wallets/{wallet_id}/pending-credits:
    post:
      tags: [Internal wallet]
      summary: Create a pending destination credit
      operationId: createPendingCredit
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMoneyCommand'
      responses:
        '200':
          description: Pending credit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/wallets/{wallet_id}/captures:
    post:
      tags: [Internal wallet]
      summary: Capture a reservation
      operationId: captureWalletReservation
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMoneyCommand'
      responses:
        '200':
          description: Capture result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/wallets/{wallet_id}/finalizations:
    post:
      tags: [Internal wallet]
      summary: Finalize a pending credit
      operationId: finalizePendingCredit
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMoneyCommand'
      responses:
        '200':
          description: Finalization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/wallets/{wallet_id}/compensations:
    post:
      tags: [Internal wallet]
      summary: Append an idempotent compensation entry
      operationId: compensateWalletOperation
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/WalletId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMoneyCommand'
      responses:
        '200':
          description: Compensation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /internal/v1/operations/{operation_id}:
    get:
      tags: [Internal wallet]
      summary: Resolve an operation status
      operationId: getOperationStatus
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OperationIdPath'
      responses:
        '200':
          description: Known operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/stats:
    get:
      tags: [Internal management]
      summary: Service telemetry and operational metrics
      operationId: getInternalStats
      security:
        - InternalTokenAuth: []
      responses:
        '200':
          description: Operational telemetry and queue statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /healthz:
    get:
      tags: [Health]
      summary: Process liveness
      operationId: healthz
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /readyz:
    get:
      tags: [Health]
      summary: Dependency-aware readiness
      operationId: readyz
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  securitySchemes:
    InternalTokenAuth:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Secret token required for internal endpoints served on the isolated internal listener (INTERNAL_HTTP_ADDR).
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    TransferId:
      name: transfer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OperationId:
      name: X-Operation-ID
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OperationIdPath:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    RequireConsistentThrough:
      name: X-Require-Consistent-Through
      in: header
      required: false
      schema:
        type: string
        description: JSON projection watermark requirement.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    IdempotencyConflict:
      description: Idempotency key conflict or request in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Internal token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    IdempotencyReplayed:
      description: True when the response is the stored result of a duplicate idempotent request.
      schema:
        type: boolean
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: UUIDv7 generated by the service or caller according to the operation contract.
    Currency:
      type: string
      enum: [USD]
    AmountMinor:
      type: integer
      format: int64
      minimum: 1
      description: Positive integer number of USD minor units.
    MoneyCommand:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          maxLength: 200
    CreateWalletRequest:
      type: object
      additionalProperties: false
      properties:
        external_reference:
          type: string
          maxLength: 200
    WalletResponse:
      type: object
      required: [wallet_id, tenant_id, account_id, currency, status, created_at]
      properties:
        wallet_id:
          $ref: '#/components/schemas/UUID'
        tenant_id:
          $ref: '#/components/schemas/UUID'
        account_id:
          $ref: '#/components/schemas/UUID'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        created_at:
          type: string
          format: date-time
    Balance:
      type: object
      required: [currency, current_minor, held_minor, available_minor]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        current_minor:
          type: integer
          format: int64
        held_minor:
          type: integer
          format: int64
          minimum: 0
        available_minor:
          type: integer
          format: int64
          minimum: 0
    BalanceResponse:
      type: object
      required: [wallet_id, balance, authoritative]
      properties:
        wallet_id:
          $ref: '#/components/schemas/UUID'
        balance:
          $ref: '#/components/schemas/Balance'
        authoritative:
          type: boolean
          const: true
    JournalCommandResponse:
      type: object
      required: [operation_id, journal_transaction_id, event_id, amount_minor, currency]
      properties:
        operation_id:
          $ref: '#/components/schemas/UUID'
        journal_transaction_id:
          $ref: '#/components/schemas/UUID'
        event_id:
          $ref: '#/components/schemas/UUID'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
    Entry:
      type: object
      required: [journal_transaction_id, occurred_at, postings]
      properties:
        journal_transaction_id:
          $ref: '#/components/schemas/UUID'
        occurred_at:
          type: string
          format: date-time
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
    Posting:
      type: object
      required: [posting_id, account_id, currency, side, amount_minor]
      properties:
        posting_id:
          $ref: '#/components/schemas/UUID'
        account_id:
          $ref: '#/components/schemas/UUID'
        currency:
          $ref: '#/components/schemas/Currency'
        side:
          type: string
          enum: [DEBIT, CREDIT]
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
    EntryListResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        next_cursor:
          type: string
    CreateTransferRequest:
      type: object
      required: [source_wallet_id, destination_wallet_id, amount_minor, currency]
      properties:
        source_wallet_id:
          $ref: '#/components/schemas/UUID'
        destination_wallet_id:
          $ref: '#/components/schemas/UUID'
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          maxLength: 200
    TransferMoneyCommand:
      allOf:
        - $ref: '#/components/schemas/MoneyCommand'
        - type: object
          required: [transfer_id]
          properties:
            transfer_id:
              $ref: '#/components/schemas/UUID'
    TransferResponse:
      type: object
      required: [transfer_id, state, amount_minor, currency]
      properties:
        transfer_id:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum: [CREATED, RESERVING, RESERVED, PENDING_CREDIT, PENDING_CREDITED, CAPTURING, CAPTURED, FINALIZING, COMPLETED, FAILED, COMPENSATION_PENDING, COMPENSATING, COMPENSATED, RECONCILIATION_REQUIRED]
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        source_wallet_id:
          $ref: '#/components/schemas/UUID'
        destination_wallet_id:
          $ref: '#/components/schemas/UUID'
        read_model_consistent_through:
          type: object
          additionalProperties: true
    OperationResponse:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
        journal_transaction_id:
          $ref: '#/components/schemas/UUID'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
    InternalStatsResponse:
      type: object
      required: [service, unpublished_outbox_count, oldest_unpublished_age_seconds, attempts_histogram, buffered_event_count, open_gap_count, dead_letter_count]
      properties:
        service:
          type: string
        unpublished_outbox_count:
          type: integer
          format: int64
        oldest_unpublished_age_seconds:
          type: number
          format: double
        attempts_histogram:
          type: object
          additionalProperties:
            type: integer
            format: int64
        buffered_event_count:
          type: integer
          format: int64
        open_gap_count:
          type: integer
          format: int64
        dead_letter_count:
          type: integer
          format: int64
